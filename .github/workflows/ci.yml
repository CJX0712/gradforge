name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci;
          elif [ -f package.json ]; then npm install; fi

      - name: Syntax check
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*')
          exit $fail

      - name: Tests
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.test?0:1)"; then
            npm test
          else
            echo "no test script; syntax gate only"
          fi
